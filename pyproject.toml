[build-system]
    requires = ["setuptools>=42", "wheel"]
    build-backend = "setuptools.build_meta"

[project]
    dynamic = ["version"]

    name = "familiars-ai"
description = "Support for Familiars AI, based on pytorch and transformers"
    readme = "README.md"
keywords = ["familiars", "ai-familiars", "familiars-ai", "nn-familiars", "familiars-nn"]
    license = "MIT"
    license-files = ["LICENSE"]
    authors = [
        { name = "IgorNk500", email = "igornk500@outlook.com" },
    ]
    requires-python = ">=3.10.0"
    classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 1 - Planning",
    "Natural Language :: English"
    ]

    dependencies = [
        "transformers",
        "torch",
        "numpy",

        "keyboard>=0.13.5",
        "mouse>=0.7.1",
        "huggingface_hub"
    ]

[project.urls]
    Homepage = "https://github.com/IgorNk500/familiars"
    Documentation = "https://github.com/IgorNk500/familiars/wiki"
    Repository = "https://github.com/IgorNk500/familiars"
    Issues = "https://github.com/IgorNk500/familiars/issues"
    Changelog = "https://github.com/IgorNk500/familiars/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
    version = {attr = "familiars.__version__"}
